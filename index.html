<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="在中国地图上记录个人铁路与航空历史行程。"
    />
    <title>空铁足迹</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="assets/css/control-panel.css" />
  </head>
  <body>
    <main id="app-shell">
      <div
        id="china-map"
        role="img"
        aria-label="中国铁路与航空历史行程地图"
      ></div>

      <header id="app-title">
        <p class="eyebrow">RAILWAY · FLIGHT · MEMORY</p>
        <h1>空铁足迹</h1>
        <p id="journey-summary">正在整理旅程……</p>
      </header>

      <section id="map-controls" aria-label="地图与行程控制">
        <button
          id="map-controls-toggle"
          class="control-drawer-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="map-controls-content"
          aria-label="展开地图控制栏"
        >
          <span class="control-drawer-arrow" aria-hidden="true">›</span>
        </button>

        <div
          id="map-controls-content"
          class="control-drawer-content"
          aria-hidden="true"
          inert
        >
          <div class="map-display-controls">
            <p class="control-label">地图显示</p>

            <label class="toggle-row" for="railway-layer-toggle">
              <input id="railway-layer-toggle" type="checkbox" checked />
              <span class="toggle-track" aria-hidden="true">
                <span class="toggle-thumb"></span>
              </span>
              <span>全国铁路网</span>
            </label>

            <label class="toggle-row" for="via-station-toggle">
              <input id="via-station-toggle" type="checkbox" />
              <span class="toggle-track" aria-hidden="true">
                <span class="toggle-thumb"></span>
              </span>
              <span>显示途经车站</span>
            </label>
          </div>

          <div class="journey-filter-toolbar" aria-label="行程筛选">
            <span class="journey-filter-title">行程筛选</span>
            <label>
              <span class="visually-hidden">选择年份</span>
              <select id="journey-year-filter" aria-label="选择年份">
                <option value="all">年份</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">选择月份</span>
              <select id="journey-month-filter" aria-label="选择月份">
                <option value="all">月份</option>
              </select>
            </label>
            <button
              id="journey-filter-reset"
              class="filter-reset"
              type="button"
            >
              重置
            </button>
          </div>

          <section id="journey-history-panel" aria-label="历史行程">
            <div
              id="journey-history-list"
              class="journey-history-list"
            ></div>

            <div class="history-actions">
              <button
                id="clear-journey-highlight"
                class="secondary-action"
                type="button"
                disabled
              >
                取消所有路线高亮
              </button>
            </div>
          </section>
        </div>
      </section>

      <nav id="map-zoom-control" aria-label="地图缩放">
        <button id="map-zoom-in" type="button" aria-label="放大地图" title="放大">
          ＋
        </button>
        <button id="map-zoom-out" type="button" aria-label="缩小地图" title="缩小">
          −
        </button>
      </nav>

      <div id="loading-status" role="status">
        <span class="loading-dot"></span>
        正在铺开地图
      </div>

      <div id="error-banner" role="alert" hidden>
        <strong>地图没有成功加载</strong>
        <span id="error-message"></span>
      </div>

      <footer id="attribution">
        铁路数据
        <a
          href="https://www.openstreetmap.org/copyright"
          target="_blank"
          rel="noreferrer"
        >© OpenStreetMap contributors · ODbL</a>
      </footer>
    </main>

    <noscript>请启用 JavaScript 以查看行程地图。</noscript>
    <script src="assets/vendor/maplibre-gl.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
