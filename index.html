<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="在中国地图上记录个人铁路与航空历史行程。"
    />
    <title>空铁足迹</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/control-panel.css" />
  </head>
  <body>
    <main id="app-shell">
      <div
        id="china-map"
        role="img"
        aria-label="中国铁路与航空历史行程地图"
      ></div>

      <header id="app-title">
        <p class="eyebrow">RAILWAY · FLIGHT · MEMORY</p>
        <h1>空铁足迹</h1>
        <p id="journey-summary">正在整理旅程……</p>
      </header>

      <section id="map-controls" aria-label="地图图层控制">
        <p class="control-label">地图显示</p>

        <label class="toggle-row" for="railway-layer-toggle">
          <input id="railway-layer-toggle" type="checkbox" checked />
          <span class="toggle-track" aria-hidden="true">
            <span class="toggle-thumb"></span>
          </span>
          <span>全国铁路网</span>
        </label>

        <button
          id="journey-filter-toggle"
          class="filter-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="journey-filter-panel"
        >
          <span>行程筛选</span>
          <span class="filter-arrow" aria-hidden="true">⌄</span>
        </button>

        <div id="journey-filter-panel" hidden>
          <div class="filter-field">
            <span>交通方式</span>
            <span id="mode-switch" class="segmented-control">
              <button
                class="active"
                type="button"
                data-mode="all"
                aria-pressed="true"
              >
                全部
              </button>
              <button type="button" data-mode="train" aria-pressed="false">
                铁路
              </button>
              <button type="button" data-mode="flight" aria-pressed="false">
                航空
              </button>
            </span>
          </div>
          <div class="filter-date-grid">
            <label class="filter-field">
              <span>年份</span>
              <select id="journey-year-filter">
                <option value="all">全部年份</option>
              </select>
            </label>
            <label class="filter-field">
              <span>月份</span>
              <select id="journey-month-filter">
                <option value="all">全部月份</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <nav id="page-actions" aria-label="行程操作">
        <button
          id="history-journey-button"
          type="button"
          aria-expanded="false"
          aria-controls="journey-history-panel"
        >
          历史行程
        </button>
        <button id="add-journey-button" type="button">录入行程</button>
      </nav>

      <div id="loading-status" role="status">
        <span class="loading-dot"></span>
        正在铺开地图
      </div>

      <div id="error-banner" role="alert" hidden>
        <strong>地图没有成功加载</strong>
        <span id="error-message"></span>
      </div>

      <footer id="attribution">
        铁路数据
        <a
          href="https://www.openstreetmap.org/copyright"
          target="_blank"
          rel="noreferrer"
        >© OpenStreetMap contributors · ODbL</a>
      </footer>
    </main>

    <dialog id="journey-dialog" aria-labelledby="journey-dialog-title">
      <form id="journey-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">NEW JOURNEY</p>
            <h2 id="journey-dialog-title">录入新行程</h2>
          </div>
          <button
            class="dialog-close"
            type="button"
            data-close-dialog
            aria-label="关闭"
          >
            ×
          </button>
        </div>

        <div class="form-grid">
          <label>
            <span>方式</span>
            <select id="journey-mode" name="mode">
              <option value="train">铁路</option>
              <option value="flight">航空</option>
            </select>
          </label>
          <label>
            <span>日期</span>
            <input name="date" type="date" required />
          </label>
          <label class="form-wide">
            <span>车次 / 航班号</span>
            <input
              name="code"
              type="text"
              autocomplete="off"
              placeholder="例如 G475"
              required
            />
          </label>
          <label>
            <span>起点</span>
            <input
              id="journey-start"
              name="start"
              type="text"
              list="journey-location-options"
              autocomplete="off"
              placeholder="输入中文站名"
              required
            />
          </label>
          <label>
            <span>终点</span>
            <input
              id="journey-end"
              name="end"
              type="text"
              list="journey-location-options"
              autocomplete="off"
              placeholder="输入中文站名"
              required
            />
          </label>
          <label class="form-wide">
            <span>途经站</span>
            <textarea
              id="journey-via"
              name="via"
              rows="4"
              placeholder="按顺序填写，一行一个；没有可留空"
            ></textarea>
          </label>
          <label class="form-wide">
            <span>备注（可选）</span>
            <input name="note" type="text" autocomplete="off" />
          </label>
        </div>
        <datalist id="journey-location-options"></datalist>

        <div class="form-explainer">
          <strong>静态网页不会直接改项目文件。</strong>
          提交后会下载一个更新包。运行
          <code>D:\Anaconda\python.exe pipeline\tools\import_journey_bundle.py 更新包.json</code>
          导入，再执行铁路构建脚本，即可生成真实轨迹。
        </div>
        <p id="journey-form-status" role="status"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary-action" data-close-dialog>
            取消
          </button>
          <button type="submit" class="primary-action">
            生成行程更新包
          </button>
        </div>
      </form>
    </dialog>

    <aside
      id="journey-history-panel"
      aria-labelledby="journey-history-panel-title"
      aria-hidden="true"
      inert
    >
      <div class="history-panel-heading">
        <div>
          <p class="eyebrow">JOURNEY ARCHIVE</p>
          <h2 id="journey-history-panel-title">历史行程</h2>
        </div>
        <button
          class="history-panel-close"
          type="button"
          data-close-history
        >
          关闭
        </button>
      </div>

      <p id="history-filter-summary" class="history-tip"></p>
      <div id="journey-history-list" class="journey-history-list"></div>

      <div class="history-actions">
        <button
          id="clear-journey-highlight"
          class="secondary-action"
          type="button"
          disabled
        >
          取消线路高亮
        </button>
      </div>
    </aside>

    <noscript>请启用 JavaScript 以查看行程地图。</noscript>
    <script src="assets/vendor/echarts.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
